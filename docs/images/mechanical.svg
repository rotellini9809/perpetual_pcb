<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 640" width="520" height="640" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Perpetual PCB mechanical drawing: 50 x 80 mm board, four M2.5 mounting holes 3.5 mm from each edge</title>
  <rect width="520" height="640" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <!-- board: 6 px per mm, origin (110,70), 50 x 80 mm, R3 corners -->
  <rect x="110" y="70" width="300" height="480" rx="18" fill="#e8f0e4" stroke="#1f5c2e" stroke-width="2.5"/>
  <text x="260" y="104" text-anchor="middle" fill="#1f5c2e">Pyro terminals J7–J10</text>
  <text x="260" y="526" text-anchor="middle" fill="#1f5c2e">Servo J4/J5 · XT30 J6</text>
  <text x="260" y="300" text-anchor="middle" fill="#555">Top view</text>
  <text x="260" y="320" text-anchor="middle" fill="#555">(component side)</text>
  <!-- holes: 3.5 mm = 21 px from each edge, 2.7 mm drill = r 8.1 px -->
  <g fill="#ffffff" stroke="#333" stroke-width="2">
    <circle cx="131" cy="91" r="8.1"/>
    <circle cx="389" cy="91" r="8.1"/>
    <circle cx="131" cy="529" r="8.1"/>
    <circle cx="389" cy="529" r="8.1"/>
  </g>
  <g stroke="#333" stroke-width="1" stroke-dasharray="3 3">
    <line x1="131" y1="76" x2="131" y2="44"/><line x1="389" y1="76" x2="389" y2="44"/>
    <line x1="404" y1="91" x2="476" y2="91"/><line x1="404" y1="529" x2="476" y2="529"/>
  </g>
  <g stroke="#333" stroke-width="1">
    <!-- extension lines for board edges -->
    <line x1="110" y1="560" x2="110" y2="604"/><line x1="410" y1="560" x2="410" y2="604"/>
    <line x1="100" y1="70" x2="44" y2="70"/><line x1="100" y1="550" x2="44" y2="550"/>
    <line x1="110" y1="60" x2="110" y2="20"/>
    <line x1="420" y1="550" x2="500" y2="550"/>
  </g>
  <g stroke="#333" stroke-width="1.3" fill="none" marker-start="url(#a)" marker-end="url(#a)">
    <line x1="110" y1="596" x2="410" y2="596"/>
    <line x1="52" y1="70" x2="52" y2="550"/>
    <line x1="131" y1="50" x2="389" y2="50"/>
    <line x1="468" y1="91" x2="468" y2="529"/>
    <line x1="110" y1="28" x2="131" y2="28"/>
    <line x1="490" y1="529" x2="490" y2="550"/>
  </g>
  <g fill="#111" text-anchor="middle">
    <text x="260" y="620">50.0</text>
    <text x="38" y="314" transform="rotate(-90 38 314)">80.0</text>
    <text x="260" y="42">43.0</text>
    <text x="458" y="314" transform="rotate(-90 458 314)">73.0</text>
    <text x="150" y="24" text-anchor="start">3.5</text>
    <text x="504" y="544" transform="rotate(-90 504 544)" font-size="12">3.5</text>
  </g>
  <text x="414" y="136" font-size="12" fill="#333">4 × Ø2.7</text>
  <text x="414" y="152" font-size="12" fill="#333">(M2.5)</text>
  <text x="260" y="460" text-anchor="middle" font-size="12" fill="#555">Units: mm · thickness 1.6 · corner radius 3</text>
</svg>
